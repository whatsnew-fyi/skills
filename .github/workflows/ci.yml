name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The skills promise Python 3.8+ standard library; test the ends of that range.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  lintorama:
    name: Lint (shellcheck, markdownlint, yamllint, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Same image and tag as the Stop hook in .claude/hooks/lintorama-stop.sh, so a turn that
      # ends clean locally passes here. The image walks files through git, and the checkout's
      # .git sits inside the mount.
      - run: docker run --rm -v "$PWD":/code zaventh/lintorama:7

  manifests:
    name: Manifests, decisions and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/whatsnew
      - run: python scripts/adr.py index --check
      # Dogfood: this repo's changelog is itself a Declarative Changelog.
      - run: npx -y declarative-changelog@0.2.0 validate CHANGELOG.md --require-level 2 --max-warnings 0
