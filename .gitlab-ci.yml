# GitLab CI for the What's New skills. Mirrors .github/workflows/ci.yml job for job, so a
# change that passes on one passes on the other; edit both together.

stages:
  - verify

# One pipeline per change: MR pipelines for merge requests, branch pipelines otherwise, and
# never a duplicate branch pipeline when an MR is already open for that branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

scripts:
  stage: verify
  # The skills promise Python 3.8+ standard library; test the ends of that range.
  image: python:${PYTHON}
  parallel:
    matrix:
      - PYTHON: ["3.9", "3.13"]
  script:
    - python -m unittest discover -s tests -v

lintorama:
  stage: verify
  # Same image and tag as the Stop hook in .claude/hooks/lintorama-stop.sh and the GitHub
  # workflow, so a turn that ends clean locally passes here. The image's entrypoint is
  # lint-extras; clear it so the runner's shell starts, then call it from the checkout.
  image:
    name: zaventh/lintorama:7
    entrypoint: [""]
  script:
    # lint-extras walks files through git, which refuses a checkout owned by another user.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - lint-extras

manifests:
  stage: verify
  # node:24 is Debian-based and ships python3, which adr.py needs (standard library only).
  image: node:24
  script:
    - npm install -g @anthropic-ai/claude-code
    - claude plugin validate --strict .
    - claude plugin validate --strict plugins/whatsnew
    - python3 scripts/adr.py index --check
    # Dogfood: this repo's changelog is itself a Declarative Changelog.
    - npx -y declarative-changelog@0.1 validate CHANGELOG.md --require-level 2 --max-warnings 0
